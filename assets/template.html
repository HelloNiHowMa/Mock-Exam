<style>
*,*::before,*::after{box-sizing:border-box}
:root{
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
  --bg:#eef1f5;--surface:#ffffff;--ink:#1c2433;--muted:#5a6376;--line:#d3d9e2;
  --red:#c92a2a;--red-ink:#ffffff;--bad-bg:#fbecec;
  --amber:#f5b82e;--amber-2:#fbd67a;--amber-ink:#2b2100;
  --green:#a6e3b2;--green-ink:#123d1d;--ok:#2b8a3e;--ok-bg:#e8f6eb;
  --focus:#3553d6;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#121822;--surface:#1a2230;--ink:#e4e8ef;--muted:#9aa3b4;--line:#2d3747;
    --red:#e05252;--red-ink:#ffffff;--bad-bg:#3a1c1f;
    --amber:#d99a17;--amber-2:#a8770f;--amber-ink:#1c1400;
    --green:#3f8f55;--green-ink:#effff2;--ok:#5ccf74;--ok-bg:#16301f;
    --focus:#8fa5ff;
  }
}
:root[data-theme="dark"]{
  --bg:#121822;--surface:#1a2230;--ink:#e4e8ef;--muted:#9aa3b4;--line:#2d3747;
  --red:#e05252;--red-ink:#ffffff;--bad-bg:#3a1c1f;
  --amber:#d99a17;--amber-2:#a8770f;--amber-ink:#1c1400;
  --green:#3f8f55;--green-ink:#effff2;--ok:#5ccf74;--ok-bg:#16301f;
  --focus:#8fa5ff;
}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
html,body{margin:0}
body{
  background:var(--bg);color:var(--ink);
  font-family:"Noto Sans TC","PingFang TC","Microsoft JhengHei","Heiti TC",system-ui,sans-serif;
  font-size:16px;line-height:1.65;-webkit-font-smoothing:antialiased;
}
main{max-width:760px;margin:0 auto;padding:28px 20px 56px}
h1{font-size:clamp(1.6rem,4.6vw,2.15rem);line-height:1.25;font-weight:700;margin:0 0 .25em;letter-spacing:.01em}
h2{font-size:1.1rem;line-height:1.4;margin:0;font-weight:700}
p{margin:0}
.sub{color:var(--muted)}
:focus-visible{outline:2.5px solid var(--focus);outline-offset:2px}
.sr-only{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap;border:0}
button{font:inherit;color:inherit}

.btn{border-radius:8px;padding:.6em 1.2em;cursor:pointer;border:1.5px solid transparent;line-height:1.4}
.btn.primary{background:var(--ink);color:var(--bg)}
.btn.primary:hover{opacity:.9}
.btn.ghost{background:transparent;border-color:var(--line)}
.btn.ghost:hover{border-color:var(--ink)}
.btn.text{background:none;border:none;padding:.35em .1em;color:var(--muted);text-decoration:underline;text-underline-offset:3px}
.btn.text:hover{color:var(--ink)}
.btn.danger{color:var(--red)}
.btn.big{padding:.8em 1.6em;font-weight:700;font-size:1.05rem}
.row{display:flex;flex-wrap:wrap;gap:10px;align-items:center}

header.top{margin-bottom:26px}
.resume{background:var(--surface);border:1.5px solid var(--line);border-left:5px solid var(--amber);border-radius:10px;padding:16px 18px;margin-bottom:28px;display:grid;gap:12px}

.map-head{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:baseline;gap:4px 16px}
.stat{color:var(--muted);font-size:.95rem;font-variant-numeric:tabular-nums}
.stats{display:grid;gap:3px;margin:10px 0 0;font-size:.95rem;font-variant-numeric:tabular-nums}
.stats div{display:flex;gap:12px;align-items:baseline}
.stats dt{flex:none;min-width:3.5em;color:var(--muted);font-weight:500}
.stats dd{margin:0}
.stats div + .sum{border-top:1.5px solid var(--line);padding-top:4px;margin-top:2px}
.stats .sum{font-weight:700}
.statpick{display:flex;flex-wrap:wrap;align-items:center;gap:4px 16px;margin:8px 0 0;font-size:.9rem;color:var(--muted)}
.statpick .chk{cursor:pointer}
.grid{display:grid;grid-template-columns:repeat(14,1fr);gap:6px;margin:14px 0 14px}
@media (max-width:560px){.grid{grid-template-columns:repeat(8,1fr);gap:5px}}
.cell{
  aspect-ratio:1;border-radius:6px;border:1.5px solid var(--line);background:var(--surface);
  color:var(--muted);font-weight:700;font-size:.85rem;line-height:1;cursor:pointer;padding:0;
  display:grid;place-items:center;font-variant-numeric:tabular-nums;
}
.cell:hover{border-color:var(--ink);color:var(--ink)}
.cell .cnum{display:block}
.cell .csub{display:block;font-size:.62rem;font-weight:500;margin-top:3px;opacity:.85;letter-spacing:.02em}
.cell.has-sub{align-content:center;justify-items:center;gap:0}
.s-red{background:var(--red);border-color:var(--red);color:var(--red-ink)}
.s-amber{background:repeating-linear-gradient(135deg,var(--amber) 0 5px,var(--amber-2) 5px 10px);border-color:var(--amber);color:var(--amber-ink)}
.s-green{background:var(--green);border-color:var(--green);color:var(--green-ink)}
.cell.s-red:hover,.cell.s-amber:hover,.cell.s-green:hover{border-color:var(--ink)}
.cell.s-red:hover{color:var(--red-ink)}
.cell.s-amber:hover{color:var(--amber-ink)}
.cell.s-green:hover{color:var(--green-ink)}
.cell,.sw{position:relative;overflow:hidden}
.cell.marked::after,.sw.sw-mark::after{
  content:"";position:absolute;top:0;right:0;border-style:solid;
  border-width:0 14px 14px 0;border-color:transparent var(--ink) transparent transparent;
  filter:drop-shadow(-1px 1px 0 var(--surface));
}
.sw.sw-mark::after{border-width:0 9px 9px 0}
:root{--flagc:#7c3aed}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){--flagc:#b197fc}}
:root[data-theme="dark"]{--flagc:#b197fc}
.cell.flagged{box-shadow:inset 0 0 0 2.5px var(--flagc)}
.cflag,.sw.sw-flag{background:var(--flagc);color:var(--surface);font-weight:800;text-align:center}
.cflag{position:absolute;top:0;left:0;width:12px;height:12px;font-size:.6rem;line-height:12px;border-radius:0 0 6px 0}
.sw.sw-flag{border-color:var(--flagc);font-size:.62rem;line-height:11px;vertical-align:middle}
.markbtn{
  margin-left:auto;display:inline-flex;align-items:center;gap:6px;cursor:pointer;

.chip.marked::after{content:"";position:absolute;top:0;right:0;border-style:solid;border-width:0 10px 10px 0;border-color:transparent var(--ink) transparent transparent;filter:drop-shadow(-1px 1px 0 var(--surface))}

<body>
<main id="app"></main>
<script>
/* ---------- 題庫資料 ----------
   從檔案最上方的 <script id="bank"> 和 <script id="bank-images"> 讀進題庫並檢查格式。
   格式有錯的題目不會出現在練習裡，錯誤和提醒會列在頁面最上方。題目格式見 schema.md。 */
function loadBank(){
  const errors = [], notes = [];
  const isObj = x => !!x && typeof x === "object" && !Array.isArray(x);
  const str = x => typeof x === "string" && x.trim().length > 0;
  const strArr = x => Array.isArray(x) && x.every(str);
  const dupOf = arr => { const s = new Set(); for (const v of arr){ const k = String(v).trim().toLowerCase(); if (s.has(k)) return v; s.add(k); } return null; };
  const readJSON = (id, label, fallback) => {
    const el = document.getElementById(id);
    const raw = el ? el.textContent.trim() : "";
    if (!raw || raw.startsWith("__")) return fallback;
    try { return JSON.parse(raw); }
    catch(e){ errors.push(`${label}不是合法的 JSON，整個區塊都沒有讀進來：${e.message}`); return fallback; }
  };
  const raw = readJSON("bank", "題庫區塊（id=\"bank\"）", {});
  const rawImgs = readJSON("bank-images", "圖片區塊（id=\"bank-images\"）", {});
  const bank = isObj(raw) ? raw : (errors.push("題庫區塊要是一個 { } 物件。"), {});
  const images = {};
  if (isObj(rawImgs)) Object.keys(rawImgs).forEach(k => { if (str(rawImgs[k])) images[k] = rawImgs[k].trim(); else notes.push(`圖片「${k}」沒有內容，已略過。`); });
  else errors.push("圖片區塊要是一個 { } 物件。");

  /* 設定 */
  const config = Object.assign({id: "", title: "模擬考練習簿", subtitle: "", mainLabel: "選擇題", passLine: 80, passNote: "", pace: 60, examNote: "",
    aiRole: "這門課的內訓講師", aiTerms: "專有名詞保留英文原文", aiBasis: "依教材與業界標準的正確定義說明", abbrScope: "這門課", storageKeys: null},
    isObj(bank.config) ? bank.config : {});
  ["title","subtitle","mainLabel","passNote","examNote","aiRole","aiTerms","aiBasis","abbrScope"].forEach(k => { config[k] = typeof config[k] === "string" ? config[k].trim() : ""; });
  if (!isObj(bank.config)) errors.push("缺少 config 設定。");
  if (!/^[a-z0-9][a-z0-9-]{1,39}$/.test(String(config.id || ""))){
    errors.push(`config.id「${config.id || ""}」要用 2 到 40 個小寫英文、數字或連字號，例如 "fw-upgrade-101"。目前暫用 "workbook"；不同練習簿放在同一個網站時會共用作答紀錄。`);
    config.id = "workbook";
  }
  if (!config.title) config.title = "模擬考練習簿";
  if (!config.mainLabel) config.mainLabel = "選擇題";
  if (!config.aiRole) config.aiRole = "這門課的內訓講師";
  if (!config.aiBasis) config.aiBasis = "依教材與業界標準的正確定義說明";
  if (!config.abbrScope) config.abbrScope = "這門課";
  const pl = Number(config.passLine), pc = Number(config.pace);
  config.passLine = pl > 0 && pl <= 100 ? Math.round(pl) : 80;
  config.pace = pc >= 10 && pc <= 600 ? Math.round(pc) : 60;
  config.printTitle = config.title.replace(/\s*(練習簿|模擬考)\s*$/, "").trim() || config.title;
  config.fileStem = config.printTitle.replace(/[\\/:*?"<>|（）()]/g, "").trim().replace(/\s+/g, "-") || "workbook";
  const sk = {local: config.id + "-progress-v1", remote: config.id + "-progress", inbox: config.id + "-inbox", aiLocal: config.id + "-ai-v1", aiRemote: config.id + "-ai"};
  if (isObj(config.storageKeys)) Object.keys(sk).forEach(k => { const v = config.storageKeys[k]; if (typeof v === "string" && /^[A-Za-z0-9_.~:@+-]{2,80}$/.test(v)) sk[k] = v; });

  /* 題目 */
  const questions = [], seen = new Set();
  const TYPES = ["mcq", "multi", "cls", "order", "match"];
  const qsIn = Array.isArray(bank.questions) ? bank.questions : (errors.push("題庫缺少 questions 陣列。"), []);
  qsIn.forEach((q0, idx) => {
    const where = isObj(q0) && Number.isInteger(q0.n) ? `第 ${q0.n} 題` : `questions 裡的第 ${idx + 1} 筆`;
    const bad = msg => { errors.push(`${where}：${msg}`); };
    if (!isObj(q0)) return bad("要是一個 { } 物件。");
    const q = Object.assign({}, q0);
    const type = q.type === undefined ? "mcq" : q.type;
    if (!TYPES.includes(type)) return bad(`type「${q.type}」不認得，只能是 mcq、multi、cls、order、match（縮寫題放在 abbr）。`);
    if (type === "mcq") delete q.type;
    if (!Number.isInteger(q.n) || q.n < 1 || q.n > 9998 || q.n === 1000) return bad("n 要是 1 到 999（題庫）或 1001 到 9998（頁面內建的補充題）的整數。");
    if (seen.has(q.n)) return bad("n 重複了，每題的 n 都要不一樣。");
    if (type === "mcq" || type === "multi" || type === "cls"){ if (!str(q.q)) return bad("缺少題目文字 q。"); }
    else if (q.q !== undefined && typeof q.q !== "string") return bad("q 要是文字。");
    if (q.e !== undefined && typeof q.e !== "string") return bad("解析 e 要是文字。");
    if (!str(q.e)) notes.push(`${where}：沒有解析 e。`);
    for (const f of ["img", "eimg"]){
      if (q[f] === undefined) continue;
      if (!strArr(q[f])) return bad(`${f} 要是圖片代號的陣列，例如 ["topo1"]。`);
      const miss = q[f].filter(id => !images[id]);
      if (miss.length) notes.push(`${where}：${f} 用到的圖片 ${miss.join("、")} 不在圖片區塊裡，這張圖不會顯示。`);
    }
    if (q.flag !== undefined) q.flag = !!q.flag;
    if (type === "mcq" || type === "multi"){
      if (!strArr(q.o) || q.o.length < 2 || q.o.length > 6) return bad("選項 o 要是 2 到 6 個非空白的文字。");
      const d = dupOf(q.o); if (d !== null) return bad(`選項「${d}」重複了。`);
      if (type === "mcq"){
        if (!Number.isInteger(q.a) || q.a < 0 || q.a >= q.o.length) return bad(`單選題的答案 a 要是 0 到 ${q.o.length - 1} 的整數（0 代表第一個選項）。`);
      } else {
        if (!Array.isArray(q.a) || !q.a.length || !q.a.every(i => Number.isInteger(i) && i >= 0 && i < q.o.length)) return bad(`複選題的答案 a 要是陣列，例如 [0, 2]，數字介於 0 到 ${q.o.length - 1}。`);
        if (new Set(q.a).size !== q.a.length) return bad("答案 a 裡有重複的數字。");
        q.a = q.a.slice().sort((x, y) => x - y);
      }
    } else if (type === "cls"){
      if (!strArr(q.items) || q.items.length < 2) return bad("分類題的 items 要是至少 2 個非空白的文字。");
      const d = dupOf(q.items); if (d !== null) return bad(`項目「${d}」重複了。`);
      if (!Array.isArray(q.groups) || !q.groups.length) return bad("分類題要有 groups，至少一組。");
      const used = new Set();
      for (let gi = 0; gi < q.groups.length; gi++){
        const g = q.groups[gi];
        if (!isObj(g) || (g.t !== undefined && typeof g.t !== "string") || !Array.isArray(g.s) || !g.s.length) return bad(`groups 第 ${gi + 1} 組要有標題 t 和至少一格 s，例如 {"t": "控制面", "s": [{"a": 0}]}。`);
        for (const sl of g.s){
          if (!isObj(sl) || !Number.isInteger(sl.a) || sl.a < 0 || sl.a >= q.items.length) return bad(`groups 第 ${gi + 1} 組有一格的 a 不是 0 到 ${q.items.length - 1} 的整數。`);
          if (sl.l !== undefined && typeof sl.l !== "string") return bad(`groups 第 ${gi + 1} 組有一格的標籤 l 不是文字。`);
          if (used.has(sl.a)) return bad(`項目「${q.items[sl.a]}」被放進兩個格子，每個項目最多只能用一次。`);
          used.add(sl.a);
        }
      }
    } else if (type === "order"){
      if (!strArr(q.items) || q.items.length < 2) return bad("排序題的 items 要是至少 2 個非空白的文字，照正確順序寫。");
      const d = dupOf(q.items); if (d !== null) return bad(`項目「${d}」重複了，排序會無法判定。`);
    } else if (type === "match"){
      if (!Array.isArray(q.pairs) || q.pairs.length < 2 || !q.pairs.every(p => Array.isArray(p) && p.length === 2 && str(p[0]) && str(p[1]))) return bad("配對題的 pairs 要是至少 2 組 [左, 右]，兩邊都要有文字。");
      const dl = dupOf(q.pairs.map(p => p[0])); if (dl !== null) return bad(`左欄「${dl}」重複了。`);
      const dr = dupOf(q.pairs.map(p => p[1])); if (dr !== null) return bad(`右欄「${dr}」重複了，配對會無法判定。`);
    }
    seen.add(q.n);
    questions.push(q);
  });
  questions.sort((x, y) => x.n - y.n);

  /* 縮寫題：[{cat, abbr, full, alts, e}]；也接受舊格式 [分類, 縮寫, 全名, [其他寫法], 說明]。
     作答紀錄依排列位置記錄，新增請加在最後，不要插入或刪除中間的項目。 */
  const abbr = [], seenAb = new Set();
  (Array.isArray(bank.abbr) ? bank.abbr : (bank.abbr === undefined ? [] : (errors.push("abbr 要是陣列。"), []))).forEach((r0, idx) => {
    const r = Array.isArray(r0) ? {cat: r0[0], abbr: r0[1], full: r0[2], alts: r0[3], e: r0[4]} : r0;
    const where = `縮寫題第 ${idx + 1} 筆${isObj(r) && str(r.abbr) ? `（${r.abbr}）` : ""}`;
    if (!isObj(r) || !str(r.abbr) || !str(r.full)) return errors.push(`${where}：要有縮寫 abbr 和英文全名 full。`);
    const k = r.abbr.trim().toLowerCase();
    if (seenAb.has(k)) return errors.push(`${where}：縮寫重複了。`);
    if (r.alts !== undefined && !(Array.isArray(r.alts) && r.alts.every(x => typeof x === "string"))) return errors.push(`${where}：alts 要是文字陣列。`);
    seenAb.add(k);
    abbr.push({cat: str(r.cat) ? r.cat.trim() : "縮寫", abbr: r.abbr.trim(), full: r.full.trim(), alts: (r.alts || []).map(x => x.trim()).filter(Boolean).slice(0, 10), e: typeof r.e === "string" ? r.e : ""});
  });

  /* 易混淆組：[{name, qs: [題號…], key: 分辨關鍵}] */
  const groups = [];
  const qset = new Set(questions.map(q => q.n));
  (Array.isArray(bank.groups) ? bank.groups : (bank.groups === undefined ? [] : (errors.push("groups 要是陣列。"), []))).forEach((g, idx) => {
    const where = `易混淆組第 ${idx + 1} 組${isObj(g) && str(g.name) ? `（${g.name}）` : ""}`;
    if (!isObj(g) || !str(g.name) || !Array.isArray(g.qs)) return errors.push(`${where}：要有名稱 name 和題號陣列 qs。`);
    const miss = g.qs.filter(n => !qset.has(n));
    if (miss.length) notes.push(`${where}：題號 ${miss.join("、")} 不存在或格式有錯，已略過。`);
    const qs = g.qs.filter(n => qset.has(n));
    if (qs.length < 2) return errors.push(`${where}：至少要有兩題有效的題目。`);
    groups.push({name: g.name.trim(), qs, key: typeof g.key === "string" ? g.key : ""});
  });
  if (!questions.length && !abbr.length) errors.push("題庫裡沒有任何有效的題目。");
  return {config, sk, questions, abbr, groups, images, errors, notes};
}
function showBankIssues(){
  const {errors, notes} = BANK_LOAD;
  if (!errors.length && !notes.length) return;
  const max = 60, all = errors.map(x => ["", x]).concat(notes.map(x => ["warn", x]));
  const box = document.createElement("section");
  box.className = "bank-issues";
  box.setAttribute("role", errors.length ? "alert" : "status");
  box.innerHTML = `<h2>${errors.length ? `題庫有 ${errors.length} 個錯誤` : "題庫格式正確"}${notes.length ? `${errors.length ? "，另有" : "，有"} ${notes.length} 個提醒` : ""}</h2>

/* Weak-question ranking from the last five attempts: each wrong answer scores by recency

    .filter(x => x.sc > 0)

/* ---------- account sync (db + user capabilities), with local fallback ---------- */
const remote = {ref:null, writing:false, dirty:false, timer:null, retried:false, mode:"connecting"};
const SYNC_TEXT = {
  connecting:"正在確認能否同步到你的帳號…",
  synced:"進度會同步到你的 Claude 帳號，換裝置也能接著練。",

async function initRemote(){

    if (r.extras && typeof r.extras === "object") state.extras = clone(mergeMaps(state.extras || {}, r.extras, 0));

/* Merge per question by timestamp, so answers or marks made on another device are never lost.

function startSession(ids, mode, opts){
  opts = opts || {};

  const orders = {};
  list.forEach(n => { orders[n] = shuffle(optIdx(n)); });
  const arr0 = {};
  list.forEach(n => { const q = byN[n]; if (q && (q.type === "order" || q.type === "match")) arr0[n] = derange(dragLen(q)); });
  state.session = {mode, ids:list, i:0, orders, arr: arr0, answers:{}, done:false};
  list.forEach(n => initPlace(state.session, n));
  clsSel = null;
  if (opts.gmap) state.session.gmap = opts.gmap;
  if (opts.exam){ state.session.exam = true; state.session.picks = {}; }
  const tm = mode === "single" ? "off" : pref("timerMode");
  if (tm === "up" || tm === "down"){
    state.session.timer = {mode: tm, limit: tm === "down" ? list.length * pref("pace") * 1000 : 0, used: 0, since: null, sinceN: null, paused: false, alerted: false, cont: false};

  if (!s.picks) s.picks = {};
  if (byN[n].type === "multi"){
    const cur = Array.isArray(s.picks[n]) ? s.picks[n] : [];
    s.picks[n] = cur.includes(oi) ? cur.filter(x => x !== oi) : cur.concat([oi]);
  } else s.picks[n] = oi;
  submitArmed = false;
  saveLocal();
  render();
  const b = document.querySelector(`.opt[data-opt="${oi}"]`); if (b) b.focus();
}
function examGo(i){
  const s = state.session; if (!s || !s.exam || s.submitted) return;
  if (i < 0 || i >= s.ids.length || i === s.i) return;
  timerStop();
  s.i = i;
  submitArmed = false;
  saveLocal();
  render(true);
  timerStart();
}
function submitExam(){
  const s = state.session; if (!s || !s.exam || s.submitted) return;
  timerStop();
  s.ids.forEach(n => {
    if (!examDone(s, n)) return;
    const q = byN[n], kind = examKind(n), p = s.picks[n];
    let ans, ok;
    if (kind === "multi"){ const sel = p.slice().sort((x, y) => x - y); ok = sel.length === q.a.length && sel.every((x, i) => x === q.a[i]); ans = {sel, ok}; }
    else if (kind === "abbr"){ const text = String(p).trim().slice(0, 300); ok = abbrMatch(q, text); ans = {text, ok}; }
    else if (kind === "cls"){ initPlace(s, n); const place = s.place[n].slice(); ok = clsGrade(q, place).ok; ans = {place, ok}; }
    else if (kind === "drag"){ initArr(s, n); const arr = s.arr[n].slice(); ok = arr.every((x, i) => x === i); ans = {arr, ok}; }
    else { ok = p === q.a; ans = p; }
    saveSnap(n);
    s.answers[n] = ans;
    record(n, ok, ansVal(n, ans));
  });
  s.submitted = true; s.done = true; s.i = 0;
  submitArmed = false;
  commit();
  view = "summary";
  render(true);
}

  ${body}
  <div class="exam-nav">
    <button class="btn ghost" data-act="exam-prev" ${s.i === 0 ? "disabled" : ""}>上一題</button>

function moveItem(from, to){
  const s = state.session; if (!s) return;
  const n = currentN(); const q = byN[n];
  if (qType(n) !== "drag" || s.answers[n] !== undefined || timerHalted()) return;
  initArr(s, n);
  const arr = s.arr[n];
  if (from === to || from < 0 || to < 0 || from >= arr.length || to >= arr.length) return;
  if (q.type === "match"){ const t = arr[from]; arr[from] = arr[to]; arr[to] = t; }
  else { const x = arr.splice(from, 1)[0]; arr.splice(to, 0, x); }
  if (s.exam && !s.submitted){ if (!s.picks) s.picks = {}; s.picks[n] = true; submitArmed = false; }
  saveLocal();
  render();
}
function submitDrag(){
  const s = state.session; if (!s) return;
  const n = currentN();
  if (qType(n) !== "drag" || s.answers[n] !== undefined || timerHalted()) return;
  initArr(s, n);
  timerStop();
  const arr = s.arr[n].slice();
  const ok = arr.every((x, i) => x === i);
  saveSnap(n);
  s.answers[n] = {arr, ok};
  record(n, ok, arr);
  commit();
  render();
  const h = document.getElementById("fbh"); if (h) h.focus({preventScroll:false});
}
function dragBodyHTML(s, n, q, answered, noSubmit){
  const isOrder = q.type === "order";
  const arr = answered ? s.answers[n].arr : ((s.arr && s.arr[n]) || []);
  const len = arr.length;
  const rows = arr.map((ix, pos) => {
    const text = isOrder ? q.items[ix] : q.pairs[ix][1];
    const right = ix === pos;
    const correctText = isOrder ? q.items[pos] : q.pairs[pos][1];
    const tail = answered
      ? `<span class="dmark" role="img" aria-label="${right ? "正確" : "錯誤"}">${right ? "✓" : "✗"}</span>`
      : `<span class="dbtns"><button data-act="mv-up" data-pos="${pos}" ${pos === 0 ? "disabled" : ""} aria-label="把「${esc(text)}」往上移">↑</button><button data-act="mv-down" data-pos="${pos}" ${pos === len - 1 ? "disabled" : ""} aria-label="把「${esc(text)}」往下移">↓</button></span>`;
    return `<li class="dnd-row${answered ? (right ? " ok" : " bad") : ""}" data-pos="${pos}">
      ${isOrder ? `<span class="dpos">${pos + 1}</span>` : `<span class="mleft">${esc(q.pairs[pos][0])}</span>`}
      ${answered ? "" : `<span class="grip" title="拖曳調整位置" aria-hidden="true"></span>`}
      <span class="dtext">${esc(text)}${answered && !right ? `<span class="dcorrect">正確：${esc(correctText)}</span>` : ""}</span>
      ${tail}
    </li>`;
  }).join("");
  return `<p class="qtext">${esc(q.q || DRAG_PROMPT[q.type])}</p>
  ${answered ? "" : `<p class="dhint">${isOrder ? "拖曳把手，或用 ↑ ↓ 調整順序。" : "拖曳右欄的把手，或用 ↑ ↓ 交換位置，讓右欄對到左欄。"}</p>`}
  <ol class="dnd" id="dnd" data-mode="${q.type}">${rows}</ol>

}
/* 練習中的上一題／下一題：可以回頭看已作答的題目，也可以先跳過還沒作答的題目。 */
function goTo(i){

  if (i < 0 || i >= s.ids.length || i === s.i) return;

  s.i = i;

function skipNext(){

/* 考我一題：先廣度再深度。目前的題型與題目來源範圍裡還有沒做過的題目時，一律先抽沒做過的；
   全部做過一輪後，才依序從到期複習、弱點與答錯待複習、尚未熟練的題目中抽一題，並避開剛做完的那一題。 */
function luckyPick(exclude){
  const ok = n => byN[n] && n !== exclude && srcOk(n) && typeOk(n);
  const rnd = a => a[Math.floor(Math.random() * a.length)];
  const all = ALLQ.map(q => q.n).filter(ok);
  const tiers = [
    all.filter(n => status(n) === "new"),
    dueList().filter(ok),
    Array.from(new Set(weakList().filter(ok).concat(all.filter(n => status(n) === "red" || status(n) === "amber")))),
    all.filter(n => !isMastered(n)),
    all
  ];
  const t = tiers.find(x => x.length);
  return t ? rnd(t) : null;
}
function luckyNote(){
  const list = ALLQ.map(q => q.n).filter(n => byN[n] && srcOk(n) && typeOk(n));
  const fresh = list.filter(n => status(n) === "new").length;
  const tail = "沿用下方的題型和題目來源設定。";
  if (!list.length) return "目前的篩選設定下沒有題目。";
  if (fresh) return `先把題目做過一輪，再回頭加深：這個範圍有 ${list.length} 題，還有 ${fresh} 題沒做過，會先從這些題目抽。全部做過一輪後，才抽到期複習、弱點與答錯的題目。${tail}`;
  return `這個範圍的 ${list.length} 題都做過一輪了，現在依序抽到期複習、弱點與答錯、尚未熟練的題目。${tail}`;
}
function luckyGo(exclude){
  const n = luckyPick(exclude);
  if (n === null){ state.session = null; commit(); view = "home"; render(true); return; }
  startSession([n], "lucky");
}
/* ---------- 每日一題 ----------
   一天固定一題，給每天只做一題的人用。規則：
   1. DAILY_COOL 天內做過的題目不抽，所以不會連續幾天遇到同一題。
   2. 答錯過的題目照 DAILY_REV 的間隔回來：答錯後 3 天，之後每連續答對一次拉長到 7、14、30 天，
      連續答對 4 次就不再排進複習。一般練習的複習排程（INTERVALS）不受影響。
   3. 沒答錯過的題目 DAILY_OLD 天內不再出現，而且排在新題後面。
   4. 新題和錯題複習輪流：上一題是新題，這次先抽到期的錯題；沒有到期的錯題就繼續抽新題。
   5. 抽到錯題時，有 DAILY_SWAP 的機率改抽同一個易混淆題組的另一題。
   今天抽到的題目記在 prefs.daily（跟著帳號同步），同一天重開頁面還是同一題。 */
const DAILY_COOL = 3, DAILY_REV = [3, 7, 14, 30], DAILY_OLD = 30, DAILY_SWAP = 0.5;
const DAILY_KIND = {new: "新題", rev: "複習答錯過的題目", old: "複習很久沒做的題目"};
function dailyAll(){ return typeof ALLQ !== "undefined" ? ALLQ : LABS; }
function dailyOk(n){ return !!byN[n] && srcOk(n) && typeOk(n); }
function dailyDayNum(t){ const d = new Date(t); return Math.round(Date.UTC(d.getFullYear(), d.getMonth(), d.getDate()) / 864e5); }
function dailyDayKey(){ const d = new Date(Date.now()); return d.getFullYear() + "-" + String(d.getMonth() + 1).padStart(2, "0") + "-" + String(d.getDate()).padStart(2, "0"); }
function dailyDaysSince(n){ const s = state.stats[n]; return s && s.t ? dailyDayNum(Date.now()) - dailyDayNum(s.t) : Infinity; }
function dailyNeedsReview(n){ const s = state.stats[n]; return !!s && attempts(n) > 0 && (s.w || 0) > 0 && (s.s || 0) < DAILY_REV.length; }
function dailyRevDue(n){ return dailyNeedsReview(n) && dailyDaysSince(n) >= DAILY_REV[Math.min(state.stats[n].s || 0, DAILY_REV.length - 1)]; }
function dailyRnd(a){ return a[Math.floor(Math.random() * a.length)]; }
function dailyTop(list, score){
  let best = -Infinity, out = [];
  list.forEach(n => { const v = score(n); if (v > best){ best = v; out = [n]; } else if (v === best) out.push(n); });
  return dailyRnd(out);
}
function dailyPick(lastKind){
  const all = dailyAll().map(q => q.n).filter(dailyOk);
  if (!all.length) return null;
  const age = n => Math.min(dailyDaysSince(n), 9999);
  const cool = all.filter(n => dailyDaysSince(n) >= DAILY_COOL);
  const rev = cool.filter(dailyRevDue);
  const fresh = cool.filter(n => !attempts(n));
  const old = cool.filter(n => attempts(n) > 0 && !dailyNeedsReview(n) && dailyDaysSince(n) >= DAILY_OLD);
  if (rev.length && (lastKind !== "rev" || !fresh.length)){
    /* 最近錯最多的優先，其次是連續答對次數少的、放比較久的 */
    const n = dailyTop(rev, x => weakScore(x) * 100000 - (state.stats[x].s || 0) * 10000 + age(x));
    const p = {n, kind: "rev"};
    if (typeof usableGroups === "function"){
      const gs = usableGroups().filter(x => groupQs(x.g).indexOf(n) >= 0);
      if (gs.length){
        const x = dailyRnd(gs);
        p.gi = x.i;
        const sib = groupQs(x.g).filter(m => m !== n && dailyOk(m) && dailyDaysSince(m) >= DAILY_COOL);
        if (sib.length && Math.random() < DAILY_SWAP){ p.sub = n; p.n = dailyRnd(sib); }

  if (old.length) return {n: dailyTop(old, age), kind: "old"};

  return {n, kind: dailyNeedsReview(n) ? "rev" : "old"};
}
function dailyToday(){
  const cur = pref("daily"), today = dailyDayKey();
  if (cur && cur.d === today && byN[cur.n]) return cur;
  const lk = cur ? (cur.done ? cur.kind : cur.lk) : "";
  const p = dailyPick(lk);
  if (!p) return null;

}

function dailyGo(){

function dailyHomeHTML(){
  const cur = pref("daily");
  const today = cur && cur.d === dailyDayKey() && byN[cur.n] ? cur : null;
  const list = dailyAll().map(q => q.n).filter(dailyOk);
  const s = state.session;
  const busy = !!(s && !s.done && s.ids.length > 1 && !sessAllAnswered(s));
  const waiting = list.filter(dailyNeedsReview).length;
  let note;
  if (today && today.done) note = `今天這題做完了（${today.ok ? "答對" : "答錯，" + DAILY_REV[0] + " 天後會再考一次"}）。明天會換一題。`;
  else if (busy) note = "有一回練習還沒做完，先繼續或放棄那一回，再做每日一題。";
  else if (today) note = `今天的題目已經抽好，還沒作答。`;
  else note = `一天一題，每天不重複：${DAILY_COOL} 天內做過的題目不抽；答錯的題目 ${DAILY_REV[0]} 天後回來，連續答對再拉長到 ${DAILY_REV.slice(1).join("、")} 天；新題和錯題複習輪流。沿用下方的題型和題目來源設定。`;
  if (waiting && !(today && today.done && !today.ok && waiting === 1)) note += `目前有 ${waiting} 題答錯過的題目在排隊複習。`;
  return `<div class="daily"><button class="btn primary big" data-act="daily" ${!list.length || busy || (today && today.done) ? "disabled" : ""}>每日一題</button><p class="note">${note}</p></div>`;
}
function next(){
  const s = state.session; if (!s) return;
  if (s.mode === "lucky" && s.ids.length === 1){ luckyGo(s.ids[0]); return; }
  if (s.ids.length === 1){ state.session = null; commit(); view = "home"; render(true); return; }
  if (s.i < s.ids.length - 1){ s.i++; commit(); render(true); timerStart(); return; }
  timerStop(); s.done = true; commit(); view = "summary"; render(true);
}

/* ---------- 看圖自評的拖拉題：原題庫只有題目圖和答案圖，先想好答案，再看答案圖自己評分 ---------- */

/* ---------- 分類題（cls）：題庫拖拉題轉成的互動題。點項目再點格子；有標籤的格子逐格判分，同一類沒有標籤的格子不計順序。
   作答中的放置存在 session.place[n]，place[k] 是第 k 格（各類的格子依序攤平）放的項目編號，-1 是空格。 ---------- */
let clsSel = null;   // {n, i} 選了項目區的項目，或 {n, k} 選了已放在第 k 格的項目
function clsSlots(q){
  const out = [];
  (q.groups || []).forEach((g, gi) => g.s.forEach((sl, si) => out.push({g: gi, s: si, l: sl.l || "", a: sl.a, k: out.length})));
  return out;
}
function initPlace(s, n){
  const q = byN[n]; if (!q || q.type !== "cls") return;
  const len = clsSlots(q).length;
  if (!s.place) s.place = {};
  const p = s.place[n];
  if (!Array.isArray(p) || p.length !== len || p.some(x => typeof x !== "number" || x < -1 || x >= q.items.length)) s.place[n] = Array(len).fill(-1);
}
/* 回傳每一格對不對；同一類裡沒有標籤的格子只看有沒有放到這一類的項目，不看順序。 */
function clsGrade(q, place){
  const slots = clsSlots(q);
  const marks = slots.map(() => false);
  (q.groups || []).forEach((g, gi) => {
    const mine = slots.filter(x => x.g === gi);
    const pool = mine.filter(x => !x.l).map(x => x.a);
    mine.forEach(x => {
      const v = place[x.k];
      if (x.l){ marks[x.k] = v === x.a; return; }
      const j = pool.indexOf(v);
      if (v >= 0 && j >= 0){ marks[x.k] = true; pool.splice(j, 1); }
    });
  });
  const wrong = marks.filter(m => !m).length;
  return {marks, wrong, ok: wrong === 0};
}
function clsSetPlace(s, n, place){
  s.place[n] = place;
  if (s.exam && !s.submitted){
    if (!s.picks) s.picks = {};
    if (place.some(x => x >= 0)) s.picks[n] = true; else delete s.picks[n];
    submitArmed = false;
  }
  saveLocal();
}
function clsFocus(sel){ const b = document.querySelector(sel); if (b) b.focus({preventScroll:true}); }
function clsTap(kind, v){
  const s = state.session; if (!s) return;
  const n = currentN(); const q = byN[n];
  if (!q || q.type !== "cls" || timerHalted()) return;
  if (s.answers[n] !== undefined || (s.exam && s.submitted)) return;
  initPlace(s, n);
  const place = s.place[n].slice();
  const sel = clsSel && clsSel.n === n ? clsSel : null;
  let focus = null;
  if (kind === "item"){
    clsSel = sel && sel.i === v ? null : {n, i: v};
    focus = `.cls-item[data-i="${v}"]`;
  } else if (kind === "slot"){
    if (sel && sel.i !== undefined){
      place[v] = sel.i; clsSel = null; clsSetPlace(s, n, place);
      focus = `.cls-slot[data-k="${v}"]`;
    } else if (sel && sel.k !== undefined){
      if (sel.k !== v){ const t = place[v]; place[v] = place[sel.k]; place[sel.k] = t; clsSetPlace(s, n, place); }
      clsSel = null; focus = `.cls-slot[data-k="${v}"]`;
    } else if (place[v] >= 0){
      clsSel = {n, k: v}; focus = `.cls-slot[data-k="${v}"]`;
    } else {
      focus = `.cls-slot[data-k="${v}"]`;
    }
  } else if (kind === "clear"){
    place[v] = -1; if (sel && sel.k === v) clsSel = null; clsSetPlace(s, n, place);
    focus = `.cls-slot[data-k="${v}"]`;
  } else if (kind === "back"){
    if (sel && sel.k !== undefined){ place[sel.k] = -1; clsSetPlace(s, n, place); }
    clsSel = null; focus = ".cls-bank";
  } else if (kind === "reset"){
    clsSel = null; clsSetPlace(s, n, place.map(() => -1)); focus = ".cls-bank";
  }
  render();
  if (focus) clsFocus(focus);
}
function clsSubmit(){
  const s = state.session; if (!s) return;
  const n = currentN(); const q = byN[n];
  if (!q || q.type !== "cls" || s.answers[n] !== undefined || s.exam || timerHalted()) return;
  initPlace(s, n);
  timerStop();
  const place = s.place[n].slice();
  const ok = clsGrade(q, place).ok;
  clsSel = null;
  saveSnap(n);
  s.answers[n] = {place, ok};
  record(n, ok, place);
  commit();
  render();
  const h = document.getElementById("fbh"); if (h) h.focus({preventScroll:false});
}
/* 正確答案：每一類列出應該放的項目；有標籤的格子寫成「標籤 → 項目」。 */
function clsKeyHTML(q){
  const unused = q.items.map((_, i) => i).filter(i => !q.groups.some(g => g.s.some(x => x.a === i)));
  const gs = q.groups.map(g => {
    const lab = g.s.some(x => x.l);
    const inner = g.s.map(x => `<li>${x.l ? `${esc(x.l)} → ` : ""}<strong>${esc(q.items[x.a])}</strong></li>`).join("");
    return `<li>${g.t ? `<span class="cls-keyt">${esc(g.t)}</span>` : ""}${lab ? "" : g.s.length > 1 ? `<span class="cls-keyn">（順序不拘）</span>` : ""}<ul>${inner}</ul></li>`;
  }).join("");
  return `<div class="cls-keybox"><p class="cls-keyh">正確答案</p><ul class="cls-key">${gs}</ul>${unused.length ? `<p class="cls-unused">不需要放的項目：${unused.map(i => esc(q.items[i])).join("、")}</p>` : ""}</div>`;
}
function clsOrigHTML(q){
  const ids = (q.dimg ? [q.dimg] : []).concat(q.ans || []);
  if (!ids.length) return "";
  return `<details class="cls-orig"><summary>對照原題圖（題目圖和答案圖）</summary>${imgsHTML(ids, "qimg", "原題庫拖拉題圖片")}</details>`;
}
function clsBodyHTML(s, n, q, answered, noSubmit){
  const slots = clsSlots(q);
  const place = answered ? (s.answers[n].place || []) : ((s.place && s.place[n]) || slots.map(() => -1));
  const sel = !answered && clsSel && clsSel.n === n ? clsSel : null;
  const g = answered ? clsGrade(q, place) : null;
  const used = new Set(place.filter(x => x >= 0));
  const bankIdx = q.items.map((_, i) => i).filter(i => !used.has(i));
  const filled = place.filter(x => x >= 0).length;
  const bank = answered ? "" : `<div class="cls-bank" role="group" aria-labelledby="cls-bank-h" tabindex="-1">
      <h3 id="cls-bank-h">項目（${bankIdx.length ? `還有 ${bankIdx.length} 個沒放` : "都放好了"}）</h3>
      ${bankIdx.map(i => `<button class="cls-item${sel && sel.i === i ? " sel" : ""}" data-act="cls-item" data-i="${i}" aria-pressed="${!!(sel && sel.i === i)}">${esc(q.items[i])}</button>`).join("")}
      ${sel && sel.k !== undefined ? `<button class="btn text cls-backbtn" data-act="cls-back">放回項目區</button>` : ""}
    </div>`;
  const armed = !!sel;
  const groups = q.groups.map((grp, gi) => {
    const mine = slots.filter(x => x.g === gi);
    const unordered = mine.some(x => !x.l) && mine.length > 1;
    const rows = mine.map(x => {
      const v = place[x.k];
      const txt = v >= 0 ? q.items[v] : "";
      const okCell = g ? g.marks[x.k] : null;
      const isSel = sel && sel.k === x.k;
      const cls = ["cls-slot", v >= 0 ? "filled" : "", isSel ? "sel" : "", !answered && armed && !isSel ? "armed" : "", g ? (okCell ? "ok" : "bad") : ""].filter(Boolean).join(" ");
      const where = `${grp.t ? grp.t + "，" : ""}${x.l ? x.l + "，" : ""}第 ${x.s + 1} 格`;
      const aria = answered ? `${where}：${txt || "空白"}，${okCell ? "正確" : "錯誤"}` : `${where}：${txt || "空格"}${sel ? (sel.i !== undefined ? "，按下放入選取的項目" : isSel ? "，已選取，按下取消" : "，按下和選取的項目交換") : v >= 0 ? "，按下選取以移動" : ""}`;
      const slotInner = v >= 0 ? esc(txt) : `<span class="cls-ph">${answered ? "（空白）" : "空格"}</span>`;
      const fix = g && !okCell && x.l ? `<span class="cls-fix">正確：${esc(q.items[x.a])}</span>` : "";
      const tail = answered
        ? `<span class="cls-mark ${okCell ? "ok" : "bad"}" aria-hidden="true">${okCell ? "✓" : "✗"}</span>`
        : v >= 0 ? `<button class="cls-x" data-act="cls-clear" data-k="${x.k}" aria-label="把「${esc(txt)}」放回項目區" title="放回項目區">×</button>` : "";
      return `<li class="cls-row">${x.l ? `<span class="cls-label">${esc(x.l)}</span>` : ""}<span class="cls-cell"><button class="${cls}" data-act="cls-slot" data-k="${x.k}" ${answered ? "disabled" : ""} aria-label="${esc(aria)}"${isSel ? ' aria-pressed="true"' : ""}>${slotInner}</button>${fix}</span>${tail}</li>`;
    }).join("");
    const gWrong = g && mine.some(x => !g.marks[x.k]) && unordered;
    return `<section class="cls-group">${grp.t ? `<h3 class="cls-title">${esc(grp.t)}${unordered && !answered ? `<span class="cls-any">順序不拘</span>` : ""}</h3>` : ""}<ul class="cls-slots">${rows}</ul>${gWrong ? `<p class="cls-fix">這一類應該放：${mine.filter(x => !x.l).map(x => esc(q.items[x.a])).join("、")}</p>` : ""}</section>`;
  }).join("");
  const hint = answered ? "" : `<p class="dhint">${sel ? (sel.i !== undefined ? "選好了項目，再點要放的格子。" : "選好了已放的項目，點另一格交換位置，或按「放回項目區」。") : "先點一個項目，再點要放的格子；點已放好的項目可以移到別格。"}</p>`;
  return `<p class="qtext">${esc(q.q)}</p>${imgsHTML(q.img, "qimg", "題目附圖")}
  ${hint}
  <div class="cls${answered ? " done" : ""}">${bank}<div class="cls-groups">${groups}</div></div>
  ${answered || noSubmit ? "" : `<div class="dsubmit cls-actions"><button class="btn primary big" data-act="cls-submit" ${filled ? "" : "disabled"}>送出答案${filled < slots.length ? `（還有 ${slots.length - filled} 格空著）` : ""}</button>${filled ? `<button class="btn ghost" data-act="cls-reset">全部清空</button>` : ""}</div>`}`;
}

/* ---------- 請 AI 幫忙寫解析：用 sample 能力，花的是使用者自己的 Claude 用量，只在按下按鈕時呼叫 ---------- */
let sampleApi = null, aiBusy = false, aiCtl = null, aiMsg = "", aiUndo = null;
const AI_RULES = "你是" + CONFIG.aiRole + "，要替學員寫一段解析。\n規則：\n- 用繁體中文（台灣用語）" + (CONFIG.aiTerms ? "，" + CONFIG.aiTerms : "") + "。\n- 不要標題、不要重述題目、不要用 Markdown 語法（例如 ** 或 #），只輸出解析本身。\n- " + CONFIG.aiBasis + "。如果你認為標示的正確答案有問題，最後用一句話指出並說明理由。\n\n";
function buildAiPrompt(f){
  if (f.type === "abbr"){
    const ab = f.abbr.trim(), ans = f.ans.trim();
    if (!ab || !ans) return {ok: false, msg: "要先填好縮寫和英文全名，AI 才能寫說明。"};
    return {ok: true, text: AI_RULES + "請用 1 到 3 句話說明這個縮寫是什麼、在" + CONFIG.abbrScope + "中會出現在什麼情境，以及容易和哪個相似的縮寫或概念混淆。\n\n縮寫：" + ab + "\n英文全名：" + ans};
  }
  if (f.type === "drag"){
    if (f.dtype === "order"){
      const items = f.items.map(x => x.trim()).filter(Boolean);
      if (items.length < 2) return {ok: false, msg: "要先填好至少兩個項目，AI 才能寫解析。"};
      return {ok: true, text: AI_RULES + "這是一題排序題。請用 2 到 4 句話說明這個順序的邏輯，並給一個好記的重點。\n\n題目說明：" + (f.q.trim() || DRAG_PROMPT.order) + "\n正確順序：\n" + items.map((x, i) => (i + 1) + ". " + x).join("\n")};
    }
    const pairs = f.pairs.map(p => [p[0].trim(), p[1].trim()]).filter(p => p[0] && p[1]);
    if (pairs.length < 2) return {ok: false, msg: "要先填好至少兩組配對，AI 才能寫解析。"};
    return {ok: true, text: AI_RULES + "這是一題配對題。請用 2 到 4 句話說明各組為什麼這樣對應，並點出最容易配錯的地方。\n\n題目說明：" + (f.q.trim() || DRAG_PROMPT.match) + "\n正確配對：\n" + pairs.map(p => p[0] + " → " + p[1]).join("\n")};
  }
  const q = f.q.trim();
  const opts = f.o.map(x => x.trim());
  const filled = opts.filter(Boolean);
  const marks = f.multi ? f.am : (f.a >= 0 ? [f.a] : []);
  if (!q || filled.length < 2 || !marks.length || marks.some(i => !opts[i])) return {ok: false, msg: "要先填好題目、至少兩個選項，並標出正確答案，AI 才能寫解析。"};
  const kept = [], ai = [];
  opts.forEach((x, i) => { if (x){ if (marks.includes(i)) ai.push(kept.length); kept.push(x); } });
  return {ok: true, text: AI_RULES + "這是一題選擇題。請用 2 到 4 句話先說明為什麼正確答案是對的，再點出最容易混淆的選項錯在哪裡。\n\n題目：\n" + q + "\n\n選項：\n" + kept.map((x, i) => LETTERS[i] + ". " + x).join("\n") + "\n\n正確答案：" + ai.map(i => LETTERS[i]).join("、") + (f.multi ? "（複選題，必須全部選對才算對）" : "")};
}
function aiRowHTML(f){
  if (!sampleApi) return "";
  const hasE = !!(f.e && f.e.trim());
  return `<div class="ai-row">
    ${aiBusy
      ? `<button class="btn ghost" data-act="ai-stop">停止</button><span class="ai-status" role="status">AI 正在撰寫…</span>`
      : `<button class="btn ghost" data-act="ai-explain">${hasE ? "請 AI 重寫" : "請 AI 幫忙寫"}</button>${aiUndo !== null ? `<button class="btn text" data-act="ai-undo">復原原本的內容</button>` : ""}${aiMsg ? `<span class="ai-status" role="status">${esc(aiMsg)}</span>` : ""}`}
  </div>`;
}
function aiReset(){ if (aiCtl) aiCtl.abort(); aiBusy = false; aiCtl = null; aiMsg = ""; aiUndo = null; }
function syncTextarea(){ const t = document.getElementById("f-e"); if (t && form) t.value = form.e; }
async function aiExplain(){
  if (!sampleApi || aiBusy || !form) return;
  collectForm();
  const pr = buildAiPrompt(form);
  if (!pr.ok){ aiMsg = pr.msg; skipCollectOnce = true; render(); return; }
  const f = form;
  aiUndo = f.e; aiBusy = true; aiMsg = ""; aiCtl = new AbortController();
  skipCollectOnce = true; render();
  try {
    const res = await sampleApi(pr.text, {signal: aiCtl.signal, cache: false, modelTier: "default",
      onText: ({text}) => { f.e = text; if (form === f) syncTextarea(); }});
    f.e = (res.text || "").trim();
    aiMsg = res.truncated ? "解析被截斷了，請確認內容後再儲存。" : "已填入 AI 寫的內容，請確認後再儲存。";
  } catch(e){
    const code = e && e.code;
    const part = e && typeof e.text === "string" ? e.text.trim() : "";
    if (code === "cancelled"){ f.e = part || aiUndo; aiMsg = part ? "已停止，保留目前寫到的內容。" : "已停止。"; if (!part) aiUndo = null; }
    else {
      f.e = part || aiUndo;
      if (!part) aiUndo = null;
      if (["not_granted", "sampling_disabled", "not_declared", "capability_disabled", "capability_removed", "session_expired"].includes(code)){ sampleApi = null; aiMsg = ""; }
      else if (code === "rate_limited") aiMsg = "AI 目前忙碌中，請稍後再試。";
      else if (code === "refused") aiMsg = "AI 沒有回應這個請求，可以調整題目內容後再試。";
      else aiMsg = "AI 暫時無法產生內容，請稍後再試。";
    }
  } finally {
    aiBusy = false; aiCtl = null;
    if (form === f && view === "edit"){ syncTextarea(); render(); }
  }
}

/* ---------- 原題的 AI 解析：按下按鈕才呼叫 sample（花的是使用者自己的 Claude 用量）。
   寫好的解析存在這台裝置，也同步到帳號：每 100 題一份文件（<id>-ai-0、<id>-ai-1…），不會撐大進度文件。
   有附圖的題目，如果這個檢視能傳圖片，會把題目圖一起給 AI 看。 ---------- */
const AIKEY = SK.aiLocal;
let aiNotes = (() => { try { const r = JSON.parse(localStorage.getItem(AIKEY) || "{}"); return r && typeof r === "object" ? r : {}; } catch(e){ return {}; } })();
const aiRemote = {db: null, uid: null, loaded: {}};
let qai = {n: null, busy: false, ctl: null, text: "", msg: ""};
function saveAiLocal(){ try { localStorage.setItem(AIKEY, JSON.stringify(aiNotes)); } catch(e){} }
function aiDoc(n){ return aiRemote.db.doc("data/users/" + aiRemote.uid + "/" + SK.aiRemote + "-" + Math.floor(n / 100)); }
async function loadAiBucket(n){
  if (!aiRemote.db || !aiRemote.uid) return;
  const b = Math.floor(n / 100);
  if (aiRemote.loaded[b]) return;
  aiRemote.loaded[b] = true;
  try {
    const snap = await aiDoc(n).get();
    const r = snap.exists ? snap.data() : null;
    if (!r || !r.notes || typeof r.notes !== "object") return;
    let changed = false;
    Object.keys(r.notes).forEach(k => {
      const x = r.notes[k];
      if (x && typeof x.text === "string" && x.text && (!aiNotes[k] || (x.t || 0) > (aiNotes[k].t || 0))){ aiNotes[k] = {text: x.text, t: x.t || 0}; changed = true; }
    });
    if (changed){
      saveAiLocal();
      const s = state.session, cn = currentN();
      if (view === "quiz" && s && cn !== null && s.answers[cn] !== undefined && !qai.busy) render();
    }
  } catch(e){ aiRemote.loaded[b] = false; }

async function saveAiRemote(n){

async function aiImagesFor(q){

async function qaiRun(){
  const n = currentN(); const q = n !== null ? byN[n] : null;
  if (!sampleApi || qai.busy || !q || isExtra(n) || q.type === "imgdd" || !q.o) return;
  const ctl = new AbortController();
  qai = {n, busy: true, ctl, text: "", msg: ""};
  render();
  const base = aiPromptFor(q);
  let im = {has: false, blobs: []};
  try { im = await aiImagesFor(q); } catch(e){}
  const SEEN = "\n\n題目附圖已經附上（依序是題目的 exhibit" + (q.oimg ? "，最後是圖片選項" : "") + "），請根據圖中的內容說明。";
  const UNSEEN = "\n\n這題有附圖，但你看不到圖。如果解析需要圖中的資訊，請根據題目、選項和正確答案合理推論，並說明你是怎麼推論的。";
  const call = withImg => sampleApi(base + (im.has ? (withImg ? SEEN : UNSEEN) : ""), Object.assign({signal: ctl.signal, cache: false, modelTier: "default",
    onText: ({text}) => { if (qai.n === n && qai.busy){ qai.text = text; const el = document.getElementById("qai-text"); if (el) el.textContent = text; } }},
    withImg ? {images: im.blobs} : {}));
  try {
    let res;
    try { res = await call(im.blobs.length > 0); }
    catch(e){
      if (e && (e.code === "images_unavailable" || e.code === "image_rejected") && im.blobs.length){ im.blobs = []; qai.text = ""; res = await call(false); }
      else throw e;
    }
    const text = (res.text || "").trim();
    if (text){ aiNotes[n] = {text, t: Date.now()}; saveAiLocal(); saveAiRemote(n); }
    qai.msg = res.truncated ? "解析被截斷了，可以再按一次重寫。" : "";
  } catch(e){
    const code = e && e.code;
    const part = e && typeof e.text === "string" ? e.text.trim() : "";
    if (code === "cancelled"){
      if (part){ aiNotes[n] = {text: part, t: Date.now()}; saveAiLocal(); saveAiRemote(n); }
      qai.msg = part ? "已停止，保留目前寫到的內容。" : "已停止。";
    }
    else if (["not_granted", "sampling_disabled", "not_declared", "capability_disabled", "capability_removed", "session_expired"].includes(code)){ sampleApi = null; qai.msg = ""; }
    else if (code === "rate_limited") qai.msg = "AI 目前忙碌中，請稍後再試。";
    else if (code === "refused") qai.msg = "AI 沒有回應這個請求。";
    else qai.msg = "AI 暫時無法產生內容，請稍後再試。";
  } finally {
    qai.busy = false; qai.ctl = null; qai.text = "";
    if (view === "quiz") render();
  }
}

function seededOrder(len, seed){
  const a = Array.from({length: len}, (_, i) => i);
  let x = (seed * 7919) % 233280;
  for (let i = len - 1; i > 0; i--){ x = (x * 9301 + 49297) % 233280; const j = Math.floor(x / 233280 * (i + 1)); const t = a[i]; a[i] = a[j]; a[j] = t; }
  if (len > 1 && a.every((v, i) => v === i)) a.push(a.shift());
  return a;
}
function printRef(n){

  if (q.type === "order") return `${qLabel(n)}（排序）`;

}

  return `<article class="printdoc">

    <ol class="plist">${items}</ol>

/* ---------- 誤選分析 ---------- */
function pastPicksHTML(n, q){
  const wp = wrongPicks(n);
  if (q.type === "abbr"){
    const texts = [];
    wp.forEach(v => { const t = String(v || "").trim(); if (t && !texts.some(x => x.toLowerCase() === t.toLowerCase())) texts.push(t); });
    return texts.length >= 2 ? `<p class="nextrev">最近答錯時寫過：${texts.slice(0, 3).map(t => "「" + esc(t) + "」").join("、")}</p>` : "";
  }
  if (q.type === "order" || q.type === "match") return "";
  if (q.type === "multi"){
    if (wp.length < 2) return "";
    const ext = {}, mis = {};
    wp.forEach(v => { if (!Array.isArray(v)) return; v.filter(i => !q.a.includes(i)).forEach(i => { ext[i] = (ext[i] || 0) + 1; }); q.a.filter(i => !v.includes(i)).forEach(i => { mis[i] = (mis[i] || 0) + 1; }); });
    const fmt = m => Object.keys(m).map(Number).sort((x, y) => m[y] - m[x]).map(i => `「${esc(q.o[i])}」${m[i]} 次`).join("、");
    const parts = [];
    if (Object.keys(ext).length) parts.push("常多選 " + fmt(ext));
    if (Object.keys(mis).length) parts.push("常漏選 " + fmt(mis));
    return parts.length ? `<p class="nextrev">最近答錯時${parts.join("；")}</p>` : "";
  }
  const nums = wp.filter(v => Number.isInteger(v) && q.o && q.o[v] !== undefined);
  if (nums.length < 2) return "";
  const cnt = {};
  nums.forEach(v => { cnt[v] = (cnt[v] || 0) + 1; });
  const keys = Object.keys(cnt).map(Number).sort((x, y) => cnt[y] - cnt[x]);
  const repeat = keys.some(i => cnt[i] >= 2);
  return `<p class="nextrev">最近答錯時選過：${keys.map(i => `「${esc(q.o[i])}」${cnt[i]} 次`).join("、")}${repeat ? "。重複選到同一個錯誤選項，通常代表把它和正確答案的概念搞混了。" : ""}</p>`;
}
let cfCache = [];
function confusionList(){
  const map = new Map();
  ALLQ.forEach(q => {
    if (q.type && q.type !== "mcq" && q.type !== "multi") return;
    const add = oi => {
      const t = q.o[oi]; if (!t) return;
      const key = t.trim().toLowerCase().replace(/[.。]+$/, "");
      const e = map.get(key) || {text: t.trim(), count: 0, qs: []};
      e.count++;
      if (!e.qs.includes(q.n)) e.qs.push(q.n);
      map.set(key, e);
    };
    wrongPicks(q.n).forEach(v => {
      if (Number.isInteger(v)) add(v);
      else if (Array.isArray(v) && q.type === "multi") v.filter(i => !q.a.includes(i)).forEach(add);
    });
  });
  return Array.from(map.values()).sort((a, b) => b.count - a.count || b.qs.length - a.qs.length).slice(0, 8);
}
function confusionHTML(){
  cfCache = confusionList();
  if (!cfCache.length) return "";
  return `<section class="confuse" aria-labelledby="cf-title">
    <h2 id="cf-title">最常誤選的答案</h2>
    <p class="note">統計各題最近五次作答中，答錯時選了哪個選項。同一個答案在不同題目被誤選很多次，通常代表這個概念的邊界還不清楚。點一列可以集中練習相關的題目。</p>
    <ol class="cflist">${cfCache.map((c, i) => `<li><button class="cfrow" data-cf="${i}"><span class="cft">${esc(c.text)}</span><span class="cfn">誤選 ${c.count} 次</span><span class="cfq">${c.qs.slice(0, 6).map(n => esc(qLabel(n))).join("、")}${c.qs.length > 6 ? ` 等 ${c.qs.length} 題` : ""}</span></button></li>`).join("")}</ol>
  </section>`;
}

        <button role="radio" aria-checked="${srcFilter === "all"}" data-src="all">全部來源</button>
        <button role="radio" aria-checked="${srcFilter === "orig"}" data-src="orig">只出題庫<span class="n">${bankA.length}</span></button>
        ${extraMcq.length || bankB.length ? `<button role="radio" aria-checked="${srcFilter === "extra"}" data-src="extra">只出補充題<span class="n">${EXTRA.length + bankB.length}</span></button>` : ""}
        ${variantCount ? `<button role="radio" aria-checked="${srcFilter === "variant"}" data-src="variant">只出變化題<span class="n">${variantCount}</span></button>` : ""}
      </div>
    </div>` : ""}
    ${scope === "weak" ? (() => {
      const top = pool.slice(0, n);
      const shown = top.slice(0, 20);
      return `<div class="weak-preview">
        <p class="note">依最近五次作答排序：答錯越多、錯得越近的越前面。這回會出這 ${top.length} 題：</p>
        <ul class="wkl">${shown.map(k => `<li>${qLabel(k)}${boxesHTML(k)}</li>`).join("")}</ul>
        ${top.length > shown.length ? `<p class="note">另外還有 ${top.length - shown.length} 題。</p>` : ""}
      </div>`;
    })() : ""}
    ${scope === "due" ? `<p class="note">答錯的題目 10 分鐘後就會到期；連續答對，下次複習的間隔會拉長成 1、3、7、14、30 天。先出逾期最久的題目。</p>` : ""}
    ${isGroups ? `<div class="groups">
      <p class="note">同一組的題目會連續出，每題作答後附上這組的分辨關鍵。點一組可以直接練；按下方按鈕則隨機抽幾組。</p>
      <ul class="glist">${UG.map(({g, i}) => `<li><button class="gbtn" data-group="${i}"><span>${esc(g.name)}${g.user ? `<span class="src" style="margin-left:6px">補充</span>` : ""}</span><span class="gn">${groupQs(g).length} 題</span></button></li>`).join("")}</ul>
    </div>` : ""}
    <div class="field">
      <span class="flabel" id="lab-count">${isGroups ? "題組數" : "題數"}</span>
      <div class="seg" role="radiogroup" aria-labelledby="lab-count">
        ${isGroups ? gcountBtn(3,"3 組") + gcountBtn(5,"5 組") + gcountBtn(0,"全部")
                   : countBtn(10,"10 題") + countBtn(20,"20 題") + countBtn(50,"50 題") + countBtn(0,"全部")}
      </div>
    </div>
    ${exam ? "" : `<div class="field">
      <span class="flabel" id="lab-mode">作答方式</span>
      <div class="seg" role="radiogroup" aria-labelledby="lab-mode">
        <button role="radio" aria-checked="${!!pref("recall")}" data-recall="1">先回想再看選項</button>
        <button role="radio" aria-checked="${!pref("recall")}" data-recall="0">直接看選項</button>
      </div>
    </div>`}
    <div class="field">
      <span class="flabel" id="lab-timer">計時</span>
      <div class="seg" role="radiogroup" aria-labelledby="lab-timer">
        <button role="radio" aria-checked="${pref("timerMode") === "off"}" data-timer="off">不計時</button>
        <button role="radio" aria-checked="${pref("timerMode") === "up"}" data-timer="up">正計時</button>
        <button role="radio" aria-checked="${pref("timerMode") === "down"}" data-timer="down">倒計時</button>
      </div>
      ${pref("timerMode") !== "off" ? `<p class="note">只計算作答時間：看解析時、按下暫停或離開頁面時都會停止計時。從題庫地圖點單一題練習時不計時。</p>` : ""}
    </div>
    ${pref("timerMode") === "down" ? `<div class="field">
      <span class="flabel" id="lab-pace">每題時間</span>
      <div class="seg" role="radiogroup" aria-labelledby="lab-pace">
        ${Array.from(new Set([45, 60, 90, CONFIG.pace])).sort((x, y) => x - y).map(v => `<button role="radio" aria-checked="${pref("pace") === v}" data-pace="${v}">${v} 秒${v === CONFIG.pace ? "（建議）" : ""}</button>`).join("")}
      </div>
      <p class="note">${CONFIG.examNote ? esc(CONFIG.examNote) : `預設每題 ${CONFIG.pace} 秒，可以依熟悉程度調整。`}${isGroups ? "限時會依抽到的題數計算。" : n ? `這回限時 ${fmtClock(n * pref("pace") * 1000)}。` : ""}</p>
    </div>` : ""}
    ${!isGroups && p[scope] && p[scope].length ? `<p class="note" style="margin:-4px 0 0;display:flex;flex-wrap:wrap;gap:4px 18px"><button class="btn text" data-act="browse-open">考前快速瀏覽這個範圍（${p[scope].length} 題）</button>${pool.length ? `<button class="btn text" data-act="print-setup">列印這個範圍的題目（${pool.length} 題）</button>` : ""}</p>` : ""}
    <button class="btn primary big go" data-act="start" ${n ? "" : "disabled"}>${isGroups ? `開始練習（${gcount === 0 ? "全部" : "隨機"} ${n} 組）` : exam ? `開始模擬考（${n} 題）` : `開始練習（${n} 題）`}</button>
  </section>
  <footer class="foot">
    <p class="sync" id="sync">${SYNC_TEXT[remote.mode]}</p>
    <button class="btn text danger" data-act="reset">${resetArmed ? "再按一次確認清除" : "清除所有進度"}</button>
  </footer>`;
}

function renderQuiz(){
  const s = state.session;
  const n = currentN();
  const q = byN[n];
  const abbr = q.type === "abbr";
  const drag = q.type === "order" || q.type === "match";
  const idd = q.type === "imgdd";
  const cq = q.type === "cls";
  const order = abbr || drag || idd || cq ? [] : (s.orders[n] || optIdx(n));
  const chosen = s.answers[n];
  const reviewMiss = !!(s.exam && s.submitted && chosen === undefined);
  const answered = chosen !== undefined;
  const ok = answered && isRight(n, chosen);
  const st = status(n);
  const pct = Math.round(((s.i + (answered ? 1 : 0)) / s.ids.length) * 100);

  const pill = !answered && !reviewMiss && st !== "new" ? `<span class="pill s-${st}">${st === "red" ? "上次答錯" : st === "amber" ? "複習中" : st === "master" ? "熟練" : "已掌握"}</span>` : "";

  const elim = (s.elim && s.elim[n]) || [], maybe = (s.maybe && s.maybe[n]) || [];
  const mq = q.type === "multi";
  const msel = mq ? ((s.msel && s.msel[n]) || []) : [];
  const opts = order.map((oi, pos) => {
    let cls = "", tag = "";
    const out = !answered && !reviewMiss && elim.includes(oi);
    const cand = !answered && !reviewMiss && maybe.includes(oi);
    if (mq && answered){
      const isC = q.a.includes(oi), pk = chosen.sel.includes(oi);
      cls = isC ? (pk ? "correct" : "missed") : (pk ? "wrong" : "dim");
      tag = isC ? `<span class="tag">${pk ? "正確答案" : "漏選"}</span>` : (pk ? `<span class="tag">你選的</span>` : "");
    } else if (answered || reviewMiss){
      if (oi === q.a){ cls = "correct"; tag = `<span class="tag">正確答案</span>`; }
      else if (oi === chosen){ cls = "wrong"; tag = `<span class="tag">你的答案</span>`; }
      else cls = "dim";
    } else {
      if (out) cls = "elim"; else if (cand) cls = "maybe";
      if (mq && msel.includes(oi)) cls += " picked";
    }
    const mOn = mq && !answered && msel.includes(oi);
    const optBtn = `<button class="opt ${cls}" data-opt="${oi}" ${answered || reviewMiss ? "disabled" : ""}${mq && !answered ? ` role="checkbox" aria-checked="${mOn}"` : ""} aria-label="選項 ${LETTERS[pos]}：${esc(q.o[oi])}${out ? "（已刪去）" : cand ? "（標為可能）" : ""}"><span class="let" aria-hidden="true">${LETTERS[pos]}</span><span class="otext">${esc(q.o[oi])}${optImgHTML(q, oi)}</span>${tag}</button>`;
    return answered || reviewMiss ? optBtn : `<div class="optwrap">${optBtn}<div class="marks"><button class="xbtn obtn" data-act="maybe" data-oi="${oi}" aria-pressed="${cand}" aria-label="${cand ? "取消標記" : "標為可能"}選項 ${LETTERS[pos]}" title="${cand ? "取消標記" : "暫時標記這個可能是答案"}">○</button><button class="xbtn" data-act="elim" data-oi="${oi}" aria-pressed="${out}" aria-label="${out ? "取消刪去" : "刪去"}選項 ${LETTERS[pos]}" title="${out ? "取消刪去" : "暫時標記這個不是答案"}">×</button></div></div>`;
  }).join("");

  const nextLabel = s.mode === "lucky" ? "再來一題" : s.ids.length === 1 ? "回到總覽" : (s.i === s.ids.length - 1 ? "看這回結果" : "下一題");
  const gi = s.gmap ? s.gmap[n] : undefined;
  const grp = gi !== undefined ? (allGroups()[gi] || null) : null;
  let gtag = s.mode === "daily" ? dailyTag() : "";
  if (grp && !(s.mode === "daily" && !answered)){
    const members = s.ids.filter(x => s.gmap[x] === gi);
    gtag += `<p class="gtag">題組：${esc(grp.name)}${members.length > 1 ? `（${members.indexOf(n) + 1} / ${members.length}）` : ""}</p>`;
  }
  const excluded = answered && isExcluded(n);
  const sr = answered && !excluded ? srs(n) : null;
  const hidden = isHidden(n);
  const note = s.notes && s.notes[n] ? s.notes[n] : "";
  const guessVal = drafts[n] !== undefined ? drafts[n] : note;

  const fb = answered || reviewMiss ? `
    <div class="fb ${ok ? "ok" : "bad"}" aria-live="polite">
      <h3 id="fbh" tabindex="-1">${idd ? (ok ? "自評：全部放對" : "自評：有放錯，記為答錯") : cq ? (ok ? "答對了" : `答錯了，有 ${clsGrade(q, (chosen && chosen.place) || []).wrong} 格不對`) : mq ? (ok ? "答對了" : `答錯了，正確答案是 ${q.a.map(i => LETTERS[order.indexOf(i)]).sort().join("、")}`) : reviewMiss ? `沒有作答，正確答案是 ${LETTERS[order.indexOf(q.a)]}` : drag ? (ok ? "答對了" : `答錯了，有 ${chosen.arr.filter((x, i) => x !== i).length} 個位置不對`) : abbr ? (ok ? (chosen.override ? "已改判為答對" : "答對了") : chosen.gaveUp ? "已直接看答案（記為答錯）" : "答錯了") : ok ? "答對了" : `答錯了，正確答案是 ${LETTERS[order.indexOf(q.a)]}`}</h3>
      ${excluded ? `<p class="excl-tag">不列入紀錄</p>` : ""}
      ${q.flag ? `<span class="flag">爭議題</span>` : ""}
      ${mq && !ok ? (() => {
        const miss = q.a.filter(i => !chosen.sel.includes(i)).map(i => LETTERS[order.indexOf(i)]).sort();
        const extra = chosen.sel.filter(i => !q.a.includes(i)).map(i => LETTERS[order.indexOf(i)]).sort();
        return `<p class="nextrev" style="margin:0 0 .5em">${miss.length ? `漏選 ${miss.join("、")}` : ""}${miss.length && extra.length ? "；" : ""}${extra.length ? `多選了 ${extra.join("、")}` : ""}</p>`;
      })() : ""}
      ${answered && (!q.type || q.type === "mcq" || q.type === "multi") ? markNoteHTML(s, n, q, order, chosen, ok) : ""}
      ${abbr ? `<div class="abbr-result">
        <p>正確全名：<strong>${esc(q.ans)}</strong></p>
        ${q.alts && q.alts.length ? `<p>也接受：${esc(q.alts.join("、"))}</p>` : ""}
        <p>你的答案：${chosen.text ? esc(chosen.text) : "（沒有作答）"}</p>
        ${!ok && !excluded && chosen.text ? `<p><button class="btn text" data-act="abbr-override">我其實答對了</button></p>` : ""}
      </div>` : ""}
      ${idd ? imgsHTML(q.ans, "qimg", "拖拉題正確答案") : ""}
      ${cq ? (ok ? "" : clsKeyHTML(q)) + clsOrigHTML(q) : ""}
      ${q.e ? (isExtra(n) ? `<p>${esc(q.e)}</p>` : `<p class="pre"><span class="srclbl">${isBankB(n) ? "解析" : "題庫解析"}</span>${esc(q.e)}</p>`) : ""}${imgsHTML(q.eimg, "qimg", "解析附圖")}
      ${qaiHTML(n, q)}
      ${grp ? `<div class="gkey"><h4>分辨關鍵</h4><p>${esc(grp.key)}</p></div>` : ""}
      ${answered && !excluded ? pastPicksHTML(n, q) : ""}
      ${sr ? `<p class="nextrev">下次複習：${fmtDur(Math.max(sr.due - Date.now(), 60e3))}後</p>` : ""}
      ${canExclude(n) ? (excluded
        ? `<p class="nextrev">這次作答不列入紀錄。<button class="btn text" data-act="exclude">改回列入紀錄</button></p>`
        : `<p class="nextrev"><button class="btn text" data-act="exclude">這次不列入紀錄</button></p>`) : ""}
      ${isUserExtra(n) ? `<p class="nextrev"><button class="btn text" data-act="edit-extra" data-k="${n - EXTRA_BASE}">編輯這題</button></p>` : ""}
    </div>
    <div class="nextrow">
      <span class="keys">${s.mode === "lucky" ? "按 Enter 再來一題，按 M 標記" : "按 Enter 繼續，按 M 標記"}</span>
      ${s.mode === "lucky" ? `<button class="btn ghost" data-act="home">回到總覽</button>` : ""}
      ${s.exam && s.submitted && s.i > 0 ? `<button class="btn ghost" data-act="review-prev">上一題</button>` : ""}
      ${!s.exam && s.ids.length > 1 ? `<button class="btn ghost" data-act="go-prev" ${s.i === 0 ? "disabled" : ""}>上一題</button>` : ""}
      <button class="btn primary big" data-act="next">${nextLabel}</button>
    </div>` : `<div class="nextrow"><span class="keys">${idd ? "想好後按 Enter 看答案，再自己評分；按 M 標記" : cq ? "點項目再點格子，放好後按「送出答案」；Esc 取消選取，按 M 標記" : mq && !hidden ? "按數字或字母勾選，Shift + 數字刪去、Shift + 字母標為可能，按 Enter 送出，按 M 標記" : drag ? "排好後按「送出答案」，按 M 標記" : abbr ? "輸入後按 Enter 送出" : hidden ? "想好後按 Enter 顯示選項" : `可以按 1–${order.length} 或 A–${LETTERS[order.length - 1]} 作答，Shift + 數字刪去、Shift + 字母標為可能，按 M 標記`}</span>${!s.exam && s.ids.length > 1 ? `
      <button class="btn ghost" data-act="go-prev" ${s.i === 0 ? "disabled" : ""}>上一題</button>
      <button class="btn ghost" data-act="skip-next">${s.i === s.ids.length - 1 ? "結束，看結果" : "下一題"}</button>` : ""}</div>`;

  const tv = timerView();
  const t = tmr();
  const timerBar = tv ? `<span class="timer${tv.cls ? " " + tv.cls : ""}" id="timer" role="timer">${tv.text}</span>${!timerHalted() && s.answers[n] === undefined ? `<button class="btn text" data-act="pause">暫停</button>` : ""}` : "";
  const bar = `
  <div class="qbar">
    <button class="btn text" data-act="quit">結束練習</button>
    <div class="qright">${timerBar}<span class="prog">${s.i + 1} / ${s.ids.length}</span></div>
  </div>`;
  if (t && t.alerted && !t.cont){
    const left = s.ids.filter(x => s.answers[x] === undefined).length;
    return bar + `
  <div class="halt timeup" role="alert">
    <h3>時間到</h3>
    <p>限時 ${fmtClock(t.limit)} 已經用完，還有 ${left} 題沒作答。</p>
    <div class="row"><button class="btn primary big" data-act="finish">結束並看結果</button><button class="btn ghost" data-act="overtime">繼續作答，計算超時</button></div>
  </div>`;
  }
  if (t && t.paused){
    return bar + `
  <div class="halt">
    <h3>已暫停</h3>
    <p>暫停期間題目會先藏起來，計時也會停止。</p>
    <button class="btn primary big" data-act="unpause">繼續作答</button>
  </div>`;
  }
  if (s.exam && !s.submitted) return bar + examBodyHTML(s, n, q);
  if (reviewMiss && examKind(n) !== "mcq") return bar + reviewMissHTML(s, n, q);
  return bar + `
  <div class="pbar" aria-hidden="true"><span style="width:${pct}%"></span></div>
  ${gtag}
  <div class="qhead"><h2 id="qh" tabindex="-1">${abbr ? "縮寫題" : `第 ${dispNum(n)} 題`}</h2><span class="src${isExtra(n) ? " src-extra" : ""}">${srcName(n)}</span>${drag ? `<span class="src">${q.type === "order" ? "拖拉排序" : "拖拉配對"}</span>` : ""}${idd ? `<span class="src">拖拉題・看圖自評</span>` : ""}${cq ? `<span class="src">拖拉題</span>` : ""}${q.from ? `<span class="src">變化自${esc(qLabel(q.from))}</span>` : ""}${mq ? `<span class="src">複選</span>` : ""}${boxesHTML(n, answered && !excluded && canExclude(n))}${pill}<button class="markbtn" id="markbtn" data-act="mark" aria-pressed="${isMarked(n)}"><svg viewBox="0 0 14 16" aria-hidden="true"><path d="M2 1.5h10v13l-5-3.6-5 3.6z"/></svg>${isMarked(n) ? "已標記" : "標記這題"}</button></div>
  ${idd ? ddBodyHTML(s, n, q, answered) : cq ? clsBodyHTML(s, n, q, answered) : drag ? dragBodyHTML(s, n, q, answered) : abbr ? `<p class="abbr-prompt">寫出這個縮寫的英文全名</p>
  <p class="abbr" lang="en">${esc(q.q)}</p>
  <p class="abbr-cat">類別：${esc(q.cat || "自訂")}</p>
  ${answered ? "" : `<div class="abbr-form">
    <label class="recall-label" for="abbr-in">英文全名</label>
    <div class="row"><input id="abbr-in" class="recall-input" type="text" maxlength="300" autocomplete="off" autocapitalize="off" spellcheck="false" lang="en" value="${esc(drafts[n] || "")}"><button class="btn primary" data-act="abbr-submit">送出</button></div>
    <p class="fhint">大小寫、標點、連字號和單複數都不影響判定。</p>
    <div><button class="btn ghost" data-act="abbr-giveup">想不起來，直接看答案</button></div>
  </div>`}` : `<p class="qtext">${esc(q.q)}</p>${qimgHTML(q)}
  ${hidden ? `<div class="recall">
    <p class="recall-lead">先想想答案是什麼，想好再看選項。</p>
    <label class="recall-label" for="guess">你想到的答案（可以不寫）</label>
    <input id="guess" class="recall-input" type="text" maxlength="200" autocomplete="off" spellcheck="false" value="${esc(guessVal)}">
    <button class="btn primary big" data-act="reveal">顯示選項</button>
  </div>` : `${note ? `<p class="yourguess">你想到的答案：<span>${esc(note)}</span></p>` : ""}${mq && !answered ? `<p class="multi-hint">複選題：選出所有正確答案，再按「送出答案」。</p>` : ""}<div class="opts${mq ? " multi" : ""}">${opts}</div>${mq && !answered ? `<div class="dsubmit"><button class="btn primary big" data-act="multi-submit" ${msel.length ? "" : "disabled"}>送出答案${msel.length ? `（已選 ${msel.length} 個）` : ""}</button></div>` : ""}`}`}
  ${fb}`;
}

function renderSummary(){
  const s = state.session;
  const all = s.ids.map(n => ({n, answered: s.answers[n] !== undefined, ok: isRight(n, s.answers[n]), ex: !!(s.excluded && s.excluded[n])}));
  const exCount = all.filter(r => r.ex).length;
  const res = all.filter(r => !r.ex);
  const right = res.filter(r => r.ok).length;
  const wrong = res.filter(r => s.exam ? !r.ok : (r.answered && !r.ok));
  const snippet = n => { const q = byN[n]; const t = q.type === "abbr" ? q.ans : (q.q || DRAG_PROMPT[q.type] || "").split("\n")[0]; return t.length > 90 ? t.slice(0, 90) + "…" : t; };
  const unanswered = res.filter(r => !r.answered).length;
  const again = s.exam ? wrong.length : wrong.length + unanswered;
  let timeBlock = "";
  if (s.timer){
    const t = s.timer, done = res.filter(r => r.answered).length;
    const lines = [`作答用時 ${fmtClock(t.used)}${done ? `，平均每題 ${fmtClock(t.used / done)}` : ""}`];
    if (t.mode === "down") lines.push(t.used <= t.limit ? `限時 ${fmtClock(t.limit)}，在時間內完成，還剩 ${fmtClock(t.limit - t.used, true)}` : `限時 ${fmtClock(t.limit)}，超時 ${fmtClock(t.used - t.limit)}`);
    if (unanswered) lines.push(`有 ${unanswered} 題沒作答`);
    const slow = Object.keys(s.qtime || {}).map(Number).filter(n => s.answers[n] !== undefined)
      .sort((a, b) => s.qtime[b] - s.qtime[a]).slice(0, 3);
    timeBlock = `<div class="tstats">${lines.map(l => `<p>${l}。</p>`).join("")}</div>
    ${slow.length > 1 ? `<h2 class="slowh">最花時間的題目</h2><ul class="slow">${slow.map(n => `<li><button data-q="${n}">${qLabel(n)}<span class="st">${fmtClock(s.qtime[n])}</span></button></li>`).join("")}</ul>` : ""}`;
  }
  const pct = res.length ? Math.round(right * 100 / res.length) : 0;
  return `
  <header class="top">
    <h1>${s.exam ? "模擬考成績：" : "這回"}答對 ${right} / ${res.length} 題</h1>

/* 拖曳：只從把手開始，拖曳期間用把手擷取指標，放開時依位置移動或交換。 */
let dragging = null;
$app.addEventListener("pointerdown", e => {
  const grip = e.target.closest && e.target.closest(".grip");
  if (!grip || view !== "quiz") return;
  const row = grip.closest(".dnd-row"), list = row && row.parentElement;
  if (!row || !list) return;
  e.preventDefault();
  dragging = {id: e.pointerId, from: Number(row.dataset.pos), to: Number(row.dataset.pos), rows: Array.from(list.children), mode: list.dataset.mode};
  try { grip.setPointerCapture(e.pointerId); } catch(err){}
  row.classList.add("dragging");
});
$app.addEventListener("pointermove", e => {
  if (!dragging || e.pointerId !== dragging.id) return;
  const y = e.clientY; let to = dragging.rows.length - 1;
  for (let i = 0; i < dragging.rows.length; i++){ const r = dragging.rows[i].getBoundingClientRect(); if (y < r.top + r.height / 2){ to = i; break; } }
  if (to === dragging.to) return;
  dragging.rows.forEach(r => r.classList.remove("drop-before", "drop-after", "drop-swap"));
  dragging.to = to;
  if (to !== dragging.from) dragging.rows[to].classList.add(dragging.mode === "match" ? "drop-swap" : (to < dragging.from ? "drop-before" : "drop-after"));
});
function endDragging(e){
  if (!dragging || (e && e.pointerId !== dragging.id)) return;
  const d = dragging; dragging = null;
  d.rows.forEach(r => r.classList.remove("dragging", "drop-before", "drop-after", "drop-swap"));
  if (e && e.type === "pointerup" && d.to !== d.from) moveItem(d.from, d.to);

document.addEventListener("keydown", e => {
  if (view === "browse" && browse && !browse.done){
    if (e.metaKey || e.ctrlKey || e.altKey || e.isComposing) return;
    const onBtn = !!(e.target && e.target.closest && e.target.closest("button, input"));

    if (k === "arrowright" && !onBtn){ e.preventDefault(); browseGo(browse.i + 1); }
    else if (k === "arrowleft" && !onBtn){ e.preventDefault(); browseGo(browse.i - 1); }
    else if (k === "e"){ e.preventDefault(); browse.showE = !browse.showE; render(); }
    else if (k === "m"){ e.preventDefault(); toggleMark(browse.ids[browse.i]); render(); }
    return;
  }
  if (view !== "quiz" || !state.session) return;
  if (e.metaKey || e.ctrlKey || e.altKey) return;

  if (timerHalted()) return;
  const s = state.session, n = currentN();

    if (inInput) return;
    if (k === "m"){ e.preventDefault(); toggleMark(n); render(); return; }
    const ord = s.orders[n] || optIdx(n);
    const mm = /^(?:Digit([1-6])|Key([A-F]))$/.exec(e.code || "");
    if (e.shiftKey){ if (mm){ const ix = mm[1] ? Number(mm[1]) - 1 : "ABCDEF".indexOf(mm[2]); if (ix < ord.length){ e.preventDefault(); (mm[1] ? toggleElim : toggleMaybe)(n, ord[ix]); } } return; }
    let ix = "123456".indexOf(k); if (ix < 0) ix = "abcdef".indexOf(k);
    if (ix >= 0 && k.length === 1 && ix < ord.length){ e.preventDefault(); pick(n, ord[ix]); return; }
    if ((k === "arrowright" || k === "enter") && !onButton){ e.preventDefault(); examGo(s.i + 1); return; }
    if (k === "arrowleft" && !onButton){ e.preventDefault(); examGo(s.i - 1); return; }
    return;
  }
  if (!s.exam && s.ids.length > 1 && !inInput && !onButton){
    if (k === "arrowleft"){ e.preventDefault(); goTo(s.i - 1); return; }
    if (k === "arrowright" && !answered){ e.preventDefault(); skipNext(); return; }
  }
  if (byN[n].type === "imgdd" && !answered){
    if (inInput) return;
    if (k === "m"){ e.preventDefault(); toggleMark(n); render(); return; }

    return;
  }
  if (qType(n) === "drag" && !answered){
    if (k === "m" && !inInput){ e.preventDefault(); toggleMark(n); render(); }
    return;
  }
  if (isAbbr(n) && !answered){
    if (k === "enter" && inInput){ e.preventDefault(); submitAbbr(); return; }
    if (k === "m" && !inInput){ e.preventDefault(); toggleMark(n); render(); }
    return;
  }
  if (isHidden(n)){
    if (k === "enter" && !onButton){ e.preventDefault(); reveal(); return; }
    if (k === "m" && !inInput){ e.preventDefault(); toggleMark(n); render(); }
    return;
  }
  if (inInput) return;
  if (k === "m"){ e.preventDefault(); toggleMark(n); render(); return; }
  if (!answered && e.shiftKey){
    const ord = s.orders[n] || optIdx(n);
    const m = /^(?:Digit([1-6])|Key([A-F]))$/.exec(e.code || "");
    if (m){ const idx = m[1] ? Number(m[1]) - 1 : "ABCDEF".indexOf(m[2]); if (idx < ord.length){ e.preventDefault(); (m[1] ? toggleElim : toggleMaybe)(n, ord[idx]); } }
    return;
  }
  if (!answered){
    const ord = s.orders[n] || optIdx(n);
    let idx = "123456".indexOf(k);
    if (idx < 0) idx = "abcdef".indexOf(k);
    if (idx >= 0 && idx < ord.length && k.length === 1){
      e.preventDefault();
      if (byN[n].type === "multi") toggleMulti(n, ord[idx], false); else answer(ord[idx]);
    } else if (k === "enter" && byN[n].type === "multi" && !onButton){ e.preventDefault(); submitMulti(); }
  } else if (k === "enter" || k === "arrowright"){
    if (e.target.closest && e.target.closest("button")) return;
    e.preventDefault();
    next();
  }
});

showBankIssues();
render();
initRemote();
if (window.claude && typeof window.claude.use === "function"){
  window.claude.use("downloads").then(x => { dlApi = x || null; if (view === "print") render(); }).catch(() => {});
  window.claude.use("sample").then(x => { sampleApi = x || null; if (view === "edit") render(); }).catch(() => {});
}

/* 題目附圖和解析附圖都可以點一下放大；放大後按「關閉」、Esc 或點空白處回到原畫面。 */
let zoomFrom = null;
function openZoom(id, from){
  if (!IMG[id]) return;
  closeZoom(true);
  zoomFrom = from || null;
  const box = document.createElement("div");
  box.className = "zoombox";
  box.setAttribute("role", "dialog");
  box.setAttribute("aria-modal", "true");
  box.setAttribute("aria-label", "放大的圖片");
  box.innerHTML = `<button type="button" class="btn zclose" data-zclose>關閉</button><img src="${imgSrc(id)}" alt="放大的解析附圖">`;
  document.body.appendChild(box);
  document.body.style.overflow = "hidden";
  box.querySelector("[data-zclose]").focus();
}
function closeZoom(silent){
  const b = document.querySelector(".zoombox"); if (!b) return;
  b.remove(); document.body.style.overflow = "";
  if (!silent && zoomFrom && document.contains(zoomFrom)) zoomFrom.focus();
  zoomFrom = null;
}
document.addEventListener("click", e => {
  const t = e.target;
  if (!t || !t.closest) return;
  const z = t.closest(".zoomable");
  if (z){ e.preventDefault(); e.stopImmediatePropagation(); openZoom(z.dataset.zoom, z); return; }
  if (t.closest(".zoombox")){ e.stopImmediatePropagation(); if (t.closest("[data-zclose]") || !t.closest(".zoombox img")) closeZoom(); }
}, true);
document.addEventListener("keydown", e => {
  if (!document.querySelector(".zoombox")) return;
  if (e.key === "Escape"){ e.preventDefault(); closeZoom(); }
  else if (e.key === "Tab"){ e.preventDefault(); const c = document.querySelector(".zoombox [data-zclose]"); if (c) c.focus(); }
  e.stopImmediatePropagation();
}, true);
</script>
